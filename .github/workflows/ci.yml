name: Quill of the Craft CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  preflight:
    name: Source tree preflight
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.ready.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - id: ready
        shell: bash
        run: |
          set -euo pipefail
          if [ -f backend/manage.py ] && [ -f backend/requirements.txt ] && [ -f frontend/package.json ] && [ -d qa ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            echo 'Full application source tree detected; production CI will run.'
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Source hydration is still in progress; full CI is intentionally skipped for this transport commit.'
          fi

  source-qa:
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pytest pyyaml pypdf
      - run: pytest -q qa
      - run: python qa/generate_traceability.py
      - name: Verify contractual PDF sample pack
        run: |
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          sample_dir=Path('docs/samples')
          expected=[
            'D-001-receipt.pdf','D-002-member-statement.pdf','D-003-meeting-minutes.pdf',
            'D-004-summons-notice.pdf','D-005-attendance-sheet.pdf','D-006-meeting-pack.pdf',
            'D-007-officer-roster.pdf','D-008-candidate-progress.pdf','D-009-arrears-notice.pdf',
            'D-010-management-pack.pdf',
          ]
          for name in expected:
            path=sample_dir/name
            assert path.is_file() and path.stat().st_size>500, f'missing/empty sample: {name}'
            reader=PdfReader(str(path))
            text='\n'.join((page.extract_text() or '') for page in reader.pages)
            assert 'Quill of the Craft' in text, f'branding missing: {name}'
            assert 'Page 1 of' in text, f'page numbering missing: {name}'
          print(f'validated {len(expected)} searchable contractual PDF samples')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: requirements-traceability
          path: |
            qa/requirements_traceability.json
            qa/requirements_traceability.csv
            docs/samples/*.pdf

  frontend:
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - working-directory: frontend
        run: npm install --no-audit --no-fund
      - working-directory: frontend
        run: npm run check:syntax
      - working-directory: frontend
        run: npm run typecheck
      - working-directory: frontend
        run: npm run build

  backend:
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
      postgres:
        image: postgres:17
        env: {POSTGRES_DB: lodgeflow, POSTGRES_USER: lodgeflow, POSTGRES_PASSWORD: lodgeflow}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lodgeflow" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DJANGO_SECRET_KEY: ci-only-not-production-secret-key-with-more-than-50-characters
      DEBUG: 'true'
      POSTGRES_DB: lodgeflow
      POSTGRES_USER: lodgeflow
      POSTGRES_PASSWORD: lodgeflow
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: 'pip'}
      - run: pip install -r backend/requirements.txt
      - working-directory: backend
        run: python manage.py check
      - working-directory: backend
        env:
          DEBUG: 'false'
          ALLOWED_HOSTS: testserver.example.org
          CSRF_TRUSTED_ORIGINS: https://testserver.example.org
          API_ALLOWED_ORIGINS: https://testserver.example.org
          CREDENTIAL_ENCRYPTION_KEYS: ci-key-version-1:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        run: python manage.py check --deploy
      - working-directory: backend
        run: python manage.py makemigrations --check --dry-run
      - working-directory: backend
        run: python manage.py migrate --noinput
      - working-directory: backend
        run: python manage.py test platform_core --verbosity 2

  security:
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: pip install pip-audit
      - run: pip-audit -r backend/requirements.txt --progress-spinner=off
      - working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-fund
      - working-directory: frontend
        run: npm audit --audit-level=high
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-e2e:
    needs: [preflight, source-qa, frontend, backend, security]
    if: >-
      always() &&
      needs.preflight.outputs.ready == 'true' &&
      needs.source-qa.result == 'success' &&
      needs.frontend.result == 'success' &&
      needs.backend.result == 'success' &&
      needs.security.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.local.example .env.local
      - run: docker compose --env-file .env.local -f docker-compose.local.yml config -q
      - run: docker compose --env-file .env.local -f docker-compose.local.yml up -d --build
      - name: Wait for running stack
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8000/api/health/ >/dev/null && curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 5
          done
          docker compose --env-file .env.local -f docker-compose.local.yml ps
          docker compose --env-file .env.local -f docker-compose.local.yml logs --tail=200
          exit 1
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - working-directory: frontend
        run: npm install --no-audit --no-fund
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
          E2E_ADMIN_EMAIL: admin@lodgeflow.local
          E2E_ADMIN_PASSWORD: QuillCraftLocal123!
        run: npm run test:e2e
      - if: always()
        run: |
          mkdir -p artifacts
          docker compose --env-file .env.local -f docker-compose.local.yml logs --no-color > artifacts/docker-e2e.log || true
          cp -R frontend/test-results artifacts/test-results 2>/dev/null || true
          cp -R frontend/playwright-report artifacts/playwright-report 2>/dev/null || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: artifacts/
      - if: always()
        run: docker compose --env-file .env.local -f docker-compose.local.yml down -v
