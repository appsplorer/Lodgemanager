name: Hydrate full source bundle

on:
  push:
    branches: [main]
    paths:
      - 'source-bundles/HYDRATE_READY'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hydrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reassemble, verify and extract source bundle
        shell: bash
        run: |
          set -euo pipefail
          test -f source-bundles/HYDRATE_READY
          cat source-bundles/chunks/source.part.* | base64 -d > /tmp/qoc_hydrate_min.tar.xz
          echo '203757682b8e2fee28e9485e127e9f3fbfa4be78f0bf4fbbd3b08c947656e4eb  /tmp/qoc_hydrate_min.tar.xz' | sha256sum -c -
          cat source-bundles/chunks/logo.part.* | base64 -d > /tmp/quill-logo.png
          echo '82afe8a886a5912037e84b4216f429e1f9a23995f00c9fe79c178939fcaa0447  /tmp/quill-logo.png' | sha256sum -c -
          rm -rf .hydrate
          mkdir .hydrate
          tar -xJf /tmp/qoc_hydrate_min.tar.xz -C .hydrate
          ROOT=.hydrate/LodgeFlow_FINAL_LocalDocker_PyCharm_20260823
          test -f "$ROOT/backend/manage.py"
          test -f "$ROOT/backend/requirements.txt"
          test -f "$ROOT/frontend/package.json"
          test -d "$ROOT/qa"
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/workflows/hydrate-source.yml' \
            --exclude '.github/workflows/ci.yml' \
            "$ROOT/" ./
          mkdir -p frontend/public frontend/app
          cp /tmp/quill-logo.png frontend/public/quill-logo.png
          cp /tmp/quill-logo.png frontend/public/favicon.png
          cp /tmp/quill-logo.png frontend/app/icon.png
          rm -rf .hydrate
      - name: Verify hydrated tree before commit
        shell: bash
        run: |
          set -euo pipefail
          test -f backend/manage.py
          test -f backend/requirements.txt
          test -f frontend/package.json
          test -d qa
          test -f frontend/public/quill-logo.png
          test -f frontend/app/icon.png
      - name: Commit hydrated application tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Source tree already hydrated.'
            exit 0
          fi
          git commit -m 'feat: hydrate complete Quill of the Craft application source'
          git push origin HEAD:main
