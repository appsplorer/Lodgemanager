name: Hydrate full source bundle

on:
  push:
    branches: [main]
    paths:
      - 'source-bundles/qoc_hydrate_min.tar.xz'
      - 'source-bundles/quill-logo.png'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hydrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and extract source bundle
        shell: bash
        run: |
          set -euo pipefail
          test -f source-bundles/qoc_hydrate_min.tar.xz
          echo '203757682b8e2fee28e9485e127e9f3fbfa4be78f0bf4fbbd3b08c947656e4eb  source-bundles/qoc_hydrate_min.tar.xz' | sha256sum -c -
          rm -rf .hydrate
          mkdir .hydrate
          tar -xJf source-bundles/qoc_hydrate_min.tar.xz -C .hydrate
          ROOT=.hydrate/LodgeFlow_FINAL_LocalDocker_PyCharm_20260823
          test -d "$ROOT/backend"
          test -d "$ROOT/frontend"
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/workflows/hydrate-source.yml' \
            "$ROOT/" ./
          if [ -f source-bundles/quill-logo.png ]; then
            mkdir -p frontend/public frontend/app
            cp source-bundles/quill-logo.png frontend/public/quill-logo.png
            cp source-bundles/quill-logo.png frontend/public/favicon.png
            cp source-bundles/quill-logo.png frontend/app/icon.png
          fi
          rm -rf .hydrate
      - name: Commit hydrated application tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Source tree already hydrated.'
            exit 0
          fi
          git commit -m 'feat: hydrate complete Quill of the Craft application source'
          git push origin HEAD:main
