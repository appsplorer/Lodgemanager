services:
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${STAGING_S3_ACCESS_KEY:-lodgeflow-staging}
      MINIO_ROOT_PASSWORD: ${STAGING_S3_SECRET_KEY:-lodgeflow-staging-secret-change-me}
    volumes: [minio_staging:/data]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 30
  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio: {condition: service_healthy}
    environment:
      MINIO_ROOT_USER: ${STAGING_S3_ACCESS_KEY:-lodgeflow-staging}
      MINIO_ROOT_PASSWORD: ${STAGING_S3_SECRET_KEY:-lodgeflow-staging-secret-change-me}
      STAGING_S3_BUCKET: ${STAGING_S3_BUCKET:-lodgeflow-staging}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$STAGING_S3_BUCKET"
        mc anonymous set none "local/$STAGING_S3_BUCKET"
        mc version enable "local/$STAGING_S3_BUCKET"
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 30
  backend:
    environment:
      AWS_STORAGE_BUCKET_NAME: ${STAGING_S3_BUCKET:-lodgeflow-staging}
      AWS_ACCESS_KEY_ID: ${STAGING_S3_ACCESS_KEY:-lodgeflow-staging}
      AWS_SECRET_ACCESS_KEY: ${STAGING_S3_SECRET_KEY:-lodgeflow-staging-secret-change-me}
      AWS_S3_ENDPOINT_URL: http://minio:9000
      AWS_S3_REGION_NAME: us-east-1
      EMAIL_HOST: mailpit
      EMAIL_PORT: 1025
      EMAIL_USE_TLS: 'false'
      DEFAULT_FROM_EMAIL: LodgeFlow Staging <noreply@staging.local>
    depends_on:
      minio-init: {condition: service_completed_successfully}
      mailpit: {condition: service_healthy}
  worker:
    environment:
      AWS_STORAGE_BUCKET_NAME: ${STAGING_S3_BUCKET:-lodgeflow-staging}
      AWS_ACCESS_KEY_ID: ${STAGING_S3_ACCESS_KEY:-lodgeflow-staging}
      AWS_SECRET_ACCESS_KEY: ${STAGING_S3_SECRET_KEY:-lodgeflow-staging-secret-change-me}
      AWS_S3_ENDPOINT_URL: http://minio:9000
      AWS_S3_REGION_NAME: us-east-1
      EMAIL_HOST: mailpit
      EMAIL_PORT: 1025
      EMAIL_USE_TLS: 'false'
    depends_on:
      minio-init: {condition: service_completed_successfully}
      mailpit: {condition: service_healthy}
volumes:
  minio_staging: {}
