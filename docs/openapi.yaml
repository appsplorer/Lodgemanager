components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sessionid
  parameters:
    LodgeHeader:
      name: X-Lodge-ID
      in: header
      required: true
      description: Tenant UUID selected from the authenticated user’s active memberships; never trusted without membership
        validation.
      schema:
        type: string
        format: uuid
    CsrfHeader:
      name: X-CSRFToken
      in: header
      required: true
      description: Django CSRF token required for authenticated unsafe methods.
      schema:
        type: string
  schemas:
    Error:
      type: object
      additionalProperties: true
      required:
      - error
      properties:
        error:
          type: string
        detail: {}
        fields:
          type: object
          additionalProperties: true
        reauthenticate:
          type: boolean
  responses:
    BadRequest:
      description: Validation, parsing or workflow error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication is required or no longer valid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Identity lacks tenant/platform permission or CSRF/step-up evidence
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Object not found or deliberately hidden to prevent existence disclosure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: State, idempotency, duplicate or lifecycle conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Request rate exceeded the bounded policy
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: Payload exceeds the configured safe size
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaType:
      description: MIME type, signature or extension is unsupported
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: Payload is structurally valid but rejected by a security/workflow rule
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
security:
- sessionCookie: []
